<div id="t">挤 2（试玩版，甲第 13 天）：一只守恒的小水母，自己一直往下游，你没法掰它。<br>
你手里只有两样：<b>3 把吃的</b>（点一下撒一把，它会被拉过去）和 <b>150 格墙</b>（拖着画，它躲墙）。<br>
开局它停着，先布置好，再按"放它走"。走起来以后剩下的还能用。<br>
亮蓝的才是它的身子；灰的是它漏出来的雾，或者还没被它吃进去的吃的。它游一路漏一路，挤缝的时候也在漏，亮的那块会越来越小。<br>把它送进底下的绿带：亮的身子大半进了绿带才算到。</div>

// ---- FFT（128，原地，基 2）----
const rev=new Uint16Array(N);for(let i=0;i<N;i++){let r=0,x=i;for(let b=0;b<7;b++){r=(r<<1)|(x&1);x>>=1}rev[i]=r}
const cosT=new Float64Array(N/2),sinT=new Float64Array(N/2);for(let i=0;i<N/2;i++){cosT[i]=Math.cos(2*Math.PI*i/N);sinT[i]=Math.sin(2*Math.PI*i/N)}
function fft1(re,im,off,str,inv){const tr=new Float64Array(N),ti=new Float64Array(N);for(let i=0;i<N;i++){tr[rev[i]]=re[off+i*str];ti[rev[i]]=im[off+i*str]}
 for(let s=2;s<=N;s<<=1){const h=s>>1,st=N/s;for(let i=0;i<N;i+=s)for(let j=0;j<h;j++){const c=cosT[j*st],sn=inv?sinT[j*st]:-sinT[j*st];const a=i+j,b=a+h;const xr=tr[b]*c-ti[b]*sn,xi=tr[b]*sn+ti[b]*c;tr[b]=tr[a]-xr;ti[b]=ti[a]-xi;tr[a]+=xr;ti[a]+=xi}}
 for(let i=0;i<N;i++){re[off+i*str]=inv?tr[i]/N:tr[i];im[off+i*str]=inv?ti[i]/N:ti[i]}}
function fft2(re,im,inv){for(let y=0;y<N;y++)fft1(re,im,y*N,1,inv);for(let x=0;x<N;x++)fft1(re,im,x,N,inv)}
// ---- 核 ----
let KR,KI,cfg;
function kernel(c){c.dx=c.dx||0;const re=new Float64Array(N*N),im=new Float64Array(N*N);let sum=0;const k=c.bs.length;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const yy=(y<N/2?y:y-N)-c.dy,xx=(x<N/2?x:x-N)-c.dx;const D=Math.hypot(xx,yy)/c.R;if(D>=1)continue;const Dk=D*k,id=Math.min(Math.floor(Dk),k-1),f=Dk%1;const v=c.bs[id]*Math.exp(4-1/Math.max(f*(1-f),1e-9));re[y*N+x]=v;sum+=v}
 for(let i=0;i<N*N;i++)re[i]/=sum;fft2(re,im,false);KR=re;KI=im}
// ---- 世界 ----
let A=new Float64Array(N*N);const ur=new Float64Array(N*N),ui=new Float64Array(N*N);
function conv(){for(let i=0;i<N*N;i++){ur[i]=A[i];ui[i]=0}fft2(ur,ui,false);for(let i=0;i<N*N;i++){const a=ur[i],b=ui[i];ur[i]=a*KR[i]-b*KI[i];ui[i]=a*KI[i]+b*KR[i]}fft2(ur,ui,true);return ur}
const G=new Float64Array(N*N),idx=(y,x)=>((y+N)%N)*N+((x+N)%N);
function grow(u){return 2*Math.exp(-((u-cfg.mu)**2)/(2*cfg.sg**2))-1}
function stepClassic(){const U=conv();for(let i=0;i<N*N;i++)A[i]=Math.min(1,Math.max(0,A[i]+grow(U[i])/10))}
const gx=new Float64Array(N*N),gy=new Float64Array(N*N),ax=new Float64Array(N*N),ay=new Float64Array(N*N),Dx=new Float64Array(N*N),Dy=new Float64Array(N*N);
function sobel(F,ox,oy){for(let y=0;y<N;y++)for(let x=0;x<N;x++){const dx=(r)=>F[idx(y+r,x+1)]-F[idx(y+r,x-1)],dy=(r)=>F[idx(y+1,x+r)]-F[idx(y-1,x+r)];ox[y*N+x]=(dx(-1)+2*dx(0)+dx(1))/8;oy[y*N+x]=(dy(-1)+2*dy(0)+dy(1))/8}}
function stepFlow(){const U=conv();for(let i=0;i<N*N;i++)G[i]=grow(U[i])-Wr[i];sobel(G,gx,gy);sobel(A,ax,ay);const dt=.2,s=.65,dd=2;
 for(let i=0;i<N*N;i++){const a=Math.min(1,(A[i]/2)**2);Dx[i]=Math.max(-(dd-s),Math.min(dd-s,dt*(gx[i]*(1-a)-ax[i]*a)));Dy[i]=Math.max(-(dd-s),Math.min(dd-s,dt*(gy[i]*(1-a)-ay[i]*a)))}
 const nA=new Float64Array(N*N);for(let y=0;y<N;y++)for(let x=0;x<N;x++){let v=0;for(let oy=-dd;oy<=dd;oy++)for(let ox=-dd;ox<=dd;ox++){const j=idx(y-oy,x-ox);if(A[j]===0)continue;const cx=-ox+Dx[j],cy=-oy+Dy[j];const wx=Math.min(cx+s,.5)-Math.max(cx-s,-.5),wy=Math.min(cy+s,.5)-Math.max(cy-s,-.5);if(wx>0&&wy>0)v+=A[j]*wx*wy/(4*s*s)}nA[y*N+x]=v}A=nA}

// ---- 墙 ----
const W=new Uint8Array(N*N);let Wr=new Float64Array(N*N);
function rebuildWall(){let a=new Float64Array(N*N);for(let i=0;i<N*N;i++)a[i]=W[i];
 for(let r=0;r<2;r++){const b=new Float64Array(N*N);for(let y=0;y<N;y++)for(let x=0;x<N;x++)b[y*N+x]=(a[y*N+x]+a[idx(y+1,x)]+a[idx(y-1,x)]+a[idx(y,x+1)]+a[idx(y,x-1)])/5;a=b}
 for(let i=0;i<N*N;i++)Wr[i]=4*Math.min(1,a[i]*3)}
// ---- 画 ----
const cv=document.getElementById('c'),g=cv.getContext('2d'),img=g.createImageData(N,N);
function draw(){for(let i=0;i<N*N;i++){if(W[i]){img.data[4*i]=140;img.data[4*i+1]=90;img.data[4*i+2]=50;img.data[4*i+3]=255;continue}
 const gz=(goal&&i>=GY0*N&&i<GY1*N)?1:0;if(A[i]>.2){const c=Math.min(1,A[i]);img.data[4*i]=40+c*130;img.data[4*i+1]=90+c*140;img.data[4*i+2]=140+c*115}else{const v=Math.min(1,A[i]/.2)*95;img.data[4*i]=v;img.data[4*i+1]=v+gz*28;img.data[4*i+2]=v+gz*10}img.data[4*i+3]=255}g.putImageData(img,0,0)}
cfg={flow:1,mu:.28,sg:.03,R:10,bs:[1,.5],dy:2,dx:0};kernel(cfg);
let two=false,nofeed=0,body0=0,dead=false,steps=0,goal=true,won=false,fed=0;let GY0=108,GY1=124;
function level(n){A=new Float64Array(N*N);const b=atob(JB);for(let y=0;y<64;y++)for(let x=0;x<64;x++)A[y*N+x+32]=b.charCodeAt(y*64+x)/100;
 W.fill(0);
 if(n===0){for(let y=76;y<79;y++)for(let x=0;x<N;x++)if(x<22||x>=32)W[y*N+x]=1}
 if(n===3){for(let y=58;y<61;y++)for(let x=0;x<N;x++)if(!((x>=40&&x<54)||(x>=74&&x<88)))W[y*N+x]=1;for(let y=61;y<124;y++)for(let x=62;x<66;x++)W[y*N+x]=1}
 if(n===1){for(let y=58;y<61;y++)for(let x=0;x<N;x++)if(x<40||x>=52)W[y*N+x]=1;for(let y=96;y<99;y++)for(let x=0;x<N;x++)if(x<76||x>=88)W[y*N+x]=1}
 goal=n!==2;GY0=n===0?100:108;GY1=n===0?116:124;two=n===3;if(goal)for(let y=GY1;y<GY1+3;y++)for(let x=0;x<N;x++)W[y*N+x]=1;rebuildWall();for(let i=0;i<N*N;i++)if(W[i])A[i]=0;LW.set(W);PW.fill(0);food=3;ink=150;started=false;paused=true;body0=bodyMass();dead=false;won=false;fed=0;lastB=0;rate=0;steps=0;steer(1,0)}
function pieces(){const lab=new Int32Array(N*N);let id=0;const st=[],out=[];
 for(let s0=0;s0<N*N;s0++){if(A[s0]<=.2||lab[s0])continue;id++;let m=0,mi=0;st.push(s0);lab[s0]=id;
  while(st.length){const i=st.pop();m+=A[i];if(i>=GY0*N&&i<GY1*N)mi+=A[i];const y=(i/N)|0,x=i%N;
   for(const j of [idx(y+1,x),idx(y-1,x),idx(y,x+1),idx(y,x-1)])if(A[j]>.2&&!lab[j]){lab[j]=id;st.push(j)}}
  out.push([m,mi])}
 out.sort((a,b)=>b[0]-a[0]);return out}
function biggest(){const p=pieces();return p.length?p[0]:[0,0]}
function inGoal(){if(two){const p=pieces();if(p.length<2)return 0;const [a,b]=p;if(b[0]>=60&&a[1]/a[0]>.6&&b[1]/b[0]>.6)return a[0]+b[0];return 0}const [m,mi]=biggest();return m>0&&mi/m>.6?m:0}
function bodyMass(){let s=0;for(let i=0;i<N*N;i++)if(A[i]>.2)s+=A[i];return s}
function sprinkle(cy,cx,r){for(let y=-r;y<r;y++)for(let x=-r;x<r;x++){const j=idx(cy+y,cx+x);if(!W[j]&&Math.random()<.7)A[j]+=Math.random()}}
function steer(dy,dx){cfg.dy=2*dy;cfg.dx=2*dx;kernel(cfg)}
let mode=0;[0,1,2].forEach(k=>document.getElementById('m'+k).onclick=()=>{mode=k;[0,1,2].forEach(q=>document.getElementById('m'+q).classList.toggle('on',q===k))});
document.getElementById('lv0').onclick=()=>level(0);document.getElementById('go').onclick=()=>{started=true;paused=false;document.getElementById('p').textContent='暂停'};
let paused=true,fast=1,food=3,ink=150,started=false;const LW=new Uint8Array(N*N),PW=new Uint8Array(N*N);let lastB=0,rate=0;document.getElementById('p').onclick=e=>{if(!started)return;paused=!paused;e.target.textContent=paused?'接着动':'暂停'};
function cell(e){const r=cv.getBoundingClientRect();return [Math.floor((e.clientY-r.top)/r.height*N),Math.floor((e.clientX-r.left)/r.width*N)]}
let down=false;
function paint(e){const [y,x]=cell(e);for(let dy=0;dy<=1;dy++)for(let dx=0;dx<=1;dx++){const j=idx(y+dy,x+dx);if(LW[j])continue;if(mode===1&&!PW[j]&&ink>0&&A[j]<.1){PW[j]=1;W[j]=1;ink--}if(mode===2&&PW[j]){PW[j]=0;W[j]=0;ink++}}}
cv.addEventListener('pointerdown',e=>{if(mode===0){const [y,x]=cell(e);if(goal&&y>=GY0-5&&y<GY1+3){nofeed=20;return}if(food<=0)return;sprinkle(y,x,5);fed++;food--;return}down=true;paint(e)});
cv.addEventListener('pointermove',e=>{if(down)paint(e)});
addEventListener('pointerup',()=>{if(down){down=false;rebuildWall()}});
// 墙里的量推不出去时，挪到最近的空格（只在画墙那一下）
