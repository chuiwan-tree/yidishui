let A=new Float64Array(N*N);const ur=new Float64Array(N*N),ui=new Float64Array(N*N);
function conv(){for(let i=0;i<N*N;i++){ur[i]=A[i];ui[i]=0}fft2(ur,ui,false);for(let i=0;i<N*N;i++){const a=ur[i],b=ui[i];ur[i]=a*KR[i]-b*KI[i];ui[i]=a*KI[i]+b*KR[i]}fft2(ur,ui,true);return ur}
const G=new Float64Array(N*N),idx=(y,x)=>((y+N)%N)*N+((x+N)%N);
function grow(u){return 2*Math.exp(-((u-cfg.mu)**2)/(2*cfg.sg**2))-1}
function stepClassic(){const U=conv();for(let i=0;i<N*N;i++)A[i]=Math.min(1,Math.max(0,A[i]+grow(U[i])/10))}
const gx=new Float64Array(N*N),gy=new Float64Array(N*N),ax=new Float64Array(N*N),ay=new Float64Array(N*N),Dx=new Float64Array(N*N),Dy=new Float64Array(N*N);
function sobel(F,ox,oy){for(let y=0;y<N;y++)for(let x=0;x<N;x++){const dx=(r)=>F[idx(y+r,x+1)]-F[idx(y+r,x-1)],dy=(r)=>F[idx(y+1,x+r)]-F[idx(y-1,x+r)];ox[y*N+x]=(dx(-1)+2*dx(0)+dx(1))/8;oy[y*N+x]=(dy(-1)+2*dy(0)+dy(1))/8}}
function stepFlow(){const U=conv();for(let i=0;i<N*N;i++)G[i]=grow(U[i]);sobel(G,gx,gy);sobel(A,ax,ay);const dt=.2,s=.65,dd=2;
 for(let i=0;i<N*N;i++){const a=Math.min(1,(A[i]/2)**2);Dx[i]=Math.max(-(dd-s),Math.min(dd-s,dt*(gx[i]*(1-a)-ax[i]*a)));Dy[i]=Math.max(-(dd-s),Math.min(dd-s,dt*(gy[i]*(1-a)-ay[i]*a)))}
 const nA=new Float64Array(N*N);for(let y=0;y<N;y++)for(let x=0;x<N;x++){let v=0;for(let oy=-dd;oy<=dd;oy++)for(let ox=-dd;ox<=dd;ox++){const j=idx(y-oy,x-ox);if(A[j]===0)continue;const cx=-ox+Dx[j],cy=-oy+Dy[j];const wx=Math.min(cx+s,.5)-Math.max(cx-s,-.5),wy=Math.min(cy+s,.5)-Math.max(cy-s,-.5);if(wx>0&&wy>0)v+=A[j]*wx*wy/(4*s*s)}nA[y*N+x]=v}A=nA}
// ---- 画 ----
const cv=document.getElementById('c'),g=cv.getContext('2d'),img=g.createImageData(N,N);
function draw(){for(let i=0;i<N*N;i++){const c=Math.min(1,A[i]),h=A[i]>.04?1:0;img.data[4*i]=c*150+10*h;img.data[4*i+1]=c*205+22*h;img.data[4*i+2]=c*255+45*h;img.data[4*i+3]=255}g.putImageData(img,0,0)}
function load(name){cfg=P[name];kernel(cfg);const b=atob(S[name]);A=new Float64Array(N*N);for(let i=0;i<N*N;i++)A[i]=b.charCodeAt(i)/100;
 document.querySelectorAll('#bs button').forEach(x=>x.classList.toggle('on',x.textContent===name));document.getElementById('t').textContent=DESC[name]}
function sprinkle(cy,cx,r){for(let y=-r;y<r;y++)for(let x=-r;x<r;x++)if(Math.random()<.7)A[idx(cy+y,cx+x)]+=Math.random()*(cfg.flow?1:.9);if(!cfg.flow)for(let i=0;i<N*N;i++)A[i]=Math.min(1,A[i])}
const bs=document.getElementById('bs');for(const n of Object.keys(P)){const b=document.createElement('button');b.textContent=n;b.onclick=()=>load(n);bs.appendChild(b)}
let paused=false;document.getElementById('p').onclick=e=>{paused=!paused;e.target.textContent=paused?'接着动':'暂停'};
document.getElementById('r').onclick=()=>sprinkle(Math.floor(Math.random()*N),Math.floor(Math.random()*N),12);
document.getElementById('clr').onclick=()=>{A=new Float64Array(N*N)};
cv.onclick=e=>{const r=cv.getBoundingClientRect();sprinkle(Math.floor((e.clientY-r.top)/r.height*N),Math.floor((e.clientX-r.left)/r.width*N),cfg.flow?8:10)};
load('水母');
function loop(){if(!paused){const n=cfg.flow?4:4;for(let i=0;i<n;i++)(cfg.flow?stepFlow:stepClassic)()}draw();requestAnimationFrame(loop)}loop();
</script></body></html>
