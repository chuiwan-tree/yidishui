<!doctype html><meta charset=utf-8><title>读它</title>
<style>body{background:#16181d;color:#ddd;font:15px/1.5 sans-serif;margin:20px}canvas{display:block;margin:10px 0;image-rendering:pixelated}#hud{white-space:pre-wrap}button{margin-right:6px}</style>
<div>读它（甲，试玩版）　方向键走一格，空格原地等，R 重来　<span id=lv></span></div>
<canvas id=c></canvas><div id=hud></div>
<details><summary>规则</summary><div id=rule></div></details>
<script>
const module=undefined;
// 读它：核心规则（node 和网页共用）。甲第 13 天。
// 你是一只小东西(@)。虫(b)是你的吃的。蜥蜴(L)吃看得见的最近的那个，你也在里面。
// 吃够虫、在雨来之前回窝(H)。
const DIRS = [[0,-1],[1,0],[0,1],[-1,0]]; // 上右下左
const DCH = '^>v<';

function parse(lines, opt={}){
  const H=lines.length, W=lines[0].length;
  const g={W,H,cell:[],me:null,bugs:[],liz:[],turn:0,ate:0,need:opt.need||3,rain:opt.rain||30,dead:false,won:false,log:[]};
  for(let y=0;y<H;y++){g.cell.push([]);for(let x=0;x<W;x++){
    let c=lines[y][x];
    if(c==='@'){g.me=[x,y];c='.'}
    else if(c==='b'){g.bugs.push([x,y]);c='.'}
    else if('^>v<'.includes(c)){g.liz.push({p:[x,y],d:DCH.indexOf(c),mode:'巡',tgt:null,last:null,busy:0});c='.'}
    g.cell[y].push(c)}}
  return g;
}
const inb=(g,x,y)=>x>=0&&y>=0&&x<g.W&&y<g.H;
const walk=(g,x,y)=>inb(g,x,y)&&g.cell[y][x]!=='#';
const eq=(a,b)=>a&&b&&a[0]===b[0]&&a[1]===b[1];
const man=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]);

// 蜥蜴看得见的格：朝前 5 格内、左右不超过往前的格数；墙和草挡视线；草里的东西看不见
function sees(g,L,q){
  const [dx,dy]=DIRS[L.d]; const vx=q[0]-L.p[0], vy=q[1]-L.p[1];
  const f=vx*dx+vy*dy, side=Math.abs(vx*dy-vy*dx);
  if(f<1||f>5||side>f) return false;
  if(g.cell[q[1]][q[0]]==='"') return false;
  const n=Math.max(Math.abs(vx),Math.abs(vy));
  for(let i=1;i<n;i++){const x=Math.round(L.p[0]+vx*i/n), y=Math.round(L.p[1]+vy*i/n);
    const c=g.cell[y][x]; if(c==='#'||c==='"') return false}
  return true;
}
function viewCells(g,L){const out=[];for(let y=0;y<g.H;y++)for(let x=0;x<g.W;x++){
  if(g.cell[y][x]==='#')continue; const [dx,dy]=DIRS[L.d];const vx=x-L.p[0],vy=y-L.p[1];
  const f=vx*dx+vy*dy,side=Math.abs(vx*dy-vy*dx); if(f<1||f>5||side>f)continue;
  // 视线到这一格没被挡（这一格本身是草也算看到草面）
  const n=Math.max(Math.abs(vx),Math.abs(vy));let ok=true;
  for(let i=1;i<n;i++){const xx=Math.round(L.p[0]+vx*i/n),yy=Math.round(L.p[1]+vy*i/n);const c=g.cell[yy][xx];if(c==='#'||c==='"'){ok=false;break}}
  if(ok)out.push([x,y])}return out}

// 最短路的下一步（蜥蜴不进窝）
function stepTo(g,from,to){
  if(eq(from,to))return from;
  const key=p=>p[1]*g.W+p[0]; const prev=new Map([[key(from),null]]); const Q=[from];
  while(Q.length){const p=Q.shift(); if(eq(p,to))break;
    for(const [dx,dy] of DIRS){const q=[p[0]+dx,p[1]+dy];
      if(!walk(g,q[0],q[1])||g.cell[q[1]][q[0]]==='H'&&!eq(q,to))continue;
      if(prev.has(key(q)))continue; prev.set(key(q),p); Q.push(q)}}
  if(!prev.has(key(to)))return null;
  let p=to; while(!eq(prev.get(key(p)),from)) p=prev.get(key(p)); return p;
}

function bugNext(g,b){
    const near=g.liz.filter(L=>man(L.p,b)<=3); if(!near.length)return b;
    let best=b, bd=Math.min(...near.map(L=>man(L.p,b)));
    for(const [dx,dy] of DIRS){const q=[b[0]+dx,b[1]+dy];
      if(!walk(g,q[0],q[1])||g.cell[q[1]][q[0]]==='H'||eq(q,g.me)||g.bugs.some(o=>eq(o,q)))continue;
      const d=Math.min(...near.map(L=>man(L.p,q))); if(d>bd){bd=d;best=q}}
    return best}
function bugStep(g){
  // 虫只怕蜥蜴：蜥蜴离它 3 格以内，往离蜥蜴最远的那格挪一格（一样远按 上右下左 先到先得）
  g.bugs=g.bugs.map(b=>bugNext(g,b));
}

function lizStep(g,L){
  if(L.busy>0){L.busy--; L.mode=L.busy?'吃':'巡'; return}
  // 看：看得见的里头找最近的；一样近先虫
  const cand=[]; if(sees(g,L,g.me))cand.push({k:'你',p:g.me});
  for(const b of g.bugs) if(sees(g,L,b)) cand.push({k:'虫',p:b});
  cand.sort((a,b)=>man(L.p,a.p)-man(L.p,b.p)||(a.k==='虫'?-1:1));
  let goal=null, speed=1;
  if(cand.length){goal=cand[0];
    const wasOn = L.mode.startsWith('追')||L.mode.startsWith('发现')||L.mode==='找你';
    if(!wasOn){ L.mode='发现'+goal.k; L.tgt=goal.p.slice(); if(goal.k==='你')L.last=g.me.slice(); return }
    L.mode='追'+goal.k; L.tgt=goal.p.slice(); if(goal.k==='你')L.last=g.me.slice(); speed=2}
  else if(L.last){L.mode='找你'; goal={k:'印',p:L.last}; speed=2}
  else L.mode='巡';
  for(let s=0;s<speed;s++){
    let nx;
    if(goal){ nx=stepTo(g,L.p,goal.p); if(!nx||eq(nx,L.p)){ if(goal.k==='印'){L.last=null;L.mode='巡'} break } }
    else { // 巡：往前，挡了右转，再挡左转，再挡掉头
      for(const t of [0,1,3,2]){const d=(L.d+t)%4;const q=[L.p[0]+DIRS[d][0],L.p[1]+DIRS[d][1]];
        if(walk(g,q[0],q[1])&&g.cell[q[1]][q[0]]!=='H'&&!g.liz.some(o=>o!==L&&eq(o.p,q))){nx=q;break}}
      if(!nx)break }
    const dd=[nx[0]-L.p[0],nx[1]-L.p[1]]; L.d=DIRS.findIndex(([a,b])=>a===dd[0]&&b===dd[1]); L.p=nx;
    if(eq(L.p,g.me)){g.dead=true;g.log.push('蜥蜴扑到了你');return}
    const bi=g.bugs.findIndex(b=>eq(b,L.p));
    if(bi>=0){g.bugs.splice(bi,1);L.busy=2;L.mode='吃';L.tgt=null;g.log.push('蜥蜴吃了一只虫，要吃两回合');return}
    if(goal&&goal.k==='印'&&eq(L.p,L.last)){L.last=null;L.mode='巡';break}
    if(goal&&goal.k!=='印'&&eq(L.p,goal.p))break;
  }
}

// 走一步：d = 0..3 或 -1（不动）
function move(g,d){
  if(g.dead||g.won)return g;
  g.log=[]; g.turn++;
  if(d>=0){const q=[g.me[0]+DIRS[d][0],g.me[1]+DIRS[d][1]]; if(walk(g,q[0],q[1]))g.me=q}
  if(g.liz.some(L=>eq(L.p,g.me))){g.dead=true;g.log.push('你走进了蜥蜴嘴里');return g}
  const bi=g.bugs.findIndex(b=>eq(b,g.me)); if(bi>=0){g.bugs.splice(bi,1);g.ate++;g.log.push('你吃了一只虫（'+g.ate+'/'+g.need+'）')}
  if(g.cell[g.me[1]][g.me[0]]==='H'&&g.ate>=g.need){g.won=true;g.log.push('回窝了，第 '+g.turn+' 回合');return g}
  bugStep(g);
  for(const L of g.liz){lizStep(g,L); if(g.dead)return g}
  if(g.turn>=g.rain){g.dead=true;g.log.push('雨来了，你没回窝')}
  return g;
}

function patrolAhead(g,L,n){const out=[];let p=L.p.slice(),d=L.d;
  for(let k=0;k<n;k++){let nx=null;for(const t of [0,1,3,2]){const dd=(d+t)%4;const q=[p[0]+DIRS[dd][0],p[1]+DIRS[dd][1]];
    if(walk(g,q[0],q[1])&&g.cell[q[1]][q[0]]!=='H'){nx=q;d=dd;break}} if(!nx)break; p=nx; out.push(p.slice())} return out}
function render(g){
  const view=new Set(); for(const L of g.liz) for(const c of viewCells(g,L)) view.add(c[1]*g.W+c[0]);
  const ahead=new Set(), path=new Set(), tg=new Set(); for(const L of g.liz){ if(L.mode==='巡') for(const c of patrolAhead(g,L,4)) ahead.add(c[1]*g.W+c[0]);
    const t = L.mode==='找你'?L.last : (L.mode.startsWith('追')||L.mode.startsWith('发现'))?L.tgt:null;
    if(t){ tg.add(t[1]*g.W+t[0]); let p=L.p,k=0; while(p&&!eq(p,t)&&k<30){p=stepTo(g,p,t); if(p&&!eq(p,t))path.add(p[1]*g.W+p[0]); k++} } }
  const flee=new Set(); for(const b of g.bugs){const q=bugNext(g,b);if(q[0]!==b[0]||q[1]!==b[1]){x.strokeStyle='#b8e06a';x.lineWidth=3;x.beginPath();x.moveTo(b[0]*S+S/2,b[1]*S+S/2);x.lineTo(q[0]*S+S/2,q[1]*S+S/2);x.stroke();x.strokeRect(q[0]*S+14,q[1]*S+14,S-29,S-29)}const q=bugNext(g,b); if(!eq(q,b))flee.add(q[1]*g.W+q[0])}
  let s='';
  for(let y=0;y<g.H;y++){let r='';for(let x=0;x<g.W;x++){
    let c=g.cell[y][x]; const L=g.liz.find(L=>eq(L.p,[x,y]));
    if(L)c=DCH[L.d]; else if(eq(g.me,[x,y]))c='@'; else if(g.bugs.some(b=>eq(b,[x,y])))c='b';
    else if(flee.has(y*g.W+x))c='o'; else if(tg.has(y*g.W+x)&&c!=='"')c='X'; else if(c==='.'&&path.has(y*g.W+x))c='+'; else if(c==='.'&&ahead.has(y*g.W+x))c='*'; else if(c==='.'&&view.has(y*g.W+x))c=':';
    r+=c} s+=r+'\n'}
  s+=`回合 ${g.turn}/${g.rain}  吃了 ${g.ate}/${g.need}  `+g.liz.map(L=>'蜥蜴@'+L.p+' '+L.mode+(L.mode==='吃'?'':'')).join('；');
  if(g.log.length)s+='\n'+g.log.join('；');
  return s;
}
if(typeof module!=='undefined')module.exports={parse,move,render,sees,viewCells,patrolAhead,bugNext,stepTo,DIRS};

const LV=[["#############", "#H...\"\"..b..#", "#....\"\".....#", "#..b.###..b.#", "#....#.>....#", "#.@..#..\"\"..#", "#....b..\"\"..#", "#..b........#", "#############"], ["#############", "#H....#.....#", "#.....#..b..#", "#..\"\"...\"\"..#", "#..\"\"v..\"\"b.#", "#...........#", "#.b.#####.b.#", "#@..........#", "#############"], ["#############", "#....#H#....#", "#.b..#.#..b.#", "#....#.#....#", "#\"\".......\"\"#", "#\"\".>.....\"\"#", "#....#.#....#", "#.b..#.#..b.#", "#@...#.#....#", "#############"]];
let li=0,g; const S=44,c=document.getElementById('c'),x=c.getContext('2d');
function start(i){li=i;g=parse(LV[i]);c.width=g.W*S;c.height=g.H*S;
 document.getElementById('lv').innerHTML=LV.map((_,k)=>`<button onclick="start(${k})"${k===i?' style="font-weight:bold"':''}>第 ${k+1} 关</button>`).join('');draw()}
function draw(){
 const view=new Set(),ahead=new Set(),path=new Set(),tg=new Set();
 for(const L of g.liz){for(const q of viewCells(g,L))view.add(q[1]*g.W+q[0]);
  if(L.mode==='巡')for(const q of patrolAhead(g,L,4))ahead.add(q[1]*g.W+q[0]);
  const t=L.mode==='找你'?L.last:(L.mode.startsWith('追')||L.mode.startsWith('发现'))?L.tgt:null;
  if(t){tg.add(t[1]*g.W+t[0]);let p=L.p,k=0;while(p&&!(p[0]===t[0]&&p[1]===t[1])&&k<30){p=stepTo(g,p,t);if(p)path.add(p[1]*g.W+p[0]);k++}}}
 for(let y=0;y<g.H;y++)for(let X=0;X<g.W;X++){const ch=g.cell[y][X],k=y*g.W+X;
  x.fillStyle=ch==='#'?'#3a3f4b':ch==='"'?'#2f5a34':ch==='H'?'#6b5326':'#22252c';x.fillRect(X*S,y*S,S-1,S-1);
  if(view.has(k)){x.fillStyle='rgba(255,90,60,.22)';x.fillRect(X*S,y*S,S-1,S-1)}
  if(ahead.has(k)){x.fillStyle='rgba(255,200,80,.6)';x.beginPath();x.arc(X*S+S/2,y*S+S/2,4,0,7);x.fill()}
  if(path.has(k)){x.fillStyle='rgba(255,80,80,.8)';x.beginPath();x.arc(X*S+S/2,y*S+S/2,5,0,7);x.fill()}
  if(tg.has(k)){x.strokeStyle='#ff5040';x.lineWidth=3;x.strokeRect(X*S+5,y*S+5,S-11,S-11)}
  if(ch==='H'){x.fillStyle='#e8c070';x.font='20px sans-serif';x.fillText('窝',X*S+11,y*S+29)}}
 x.font='26px sans-serif';
 for(const b of g.bugs){x.fillStyle='#b8e06a';x.fillText('•',b[0]*S+15,b[1]*S+31);x.beginPath();x.arc(b[0]*S+S/2,b[1]*S+S/2,7,0,7);x.fill()}
 if(!g.dead||!g.liz.some(L=>L.p[0]===g.me[0]&&L.p[1]===g.me[1])){x.fillStyle='#8fd3ff';x.beginPath();x.arc(g.me[0]*S+S/2,g.me[1]*S+S/2,12,0,7);x.fill()}
 for(const L of g.liz){const cx=L.p[0]*S+S/2,cy=L.p[1]*S+S/2,[dx,dy]=DIRS[L.d];x.fillStyle=L.mode==='吃'?'#a06040':'#e2553f';
  x.beginPath();x.moveTo(cx+dx*17,cy+dy*17);x.lineTo(cx-dx*12+dy*13,cy-dy*12-dx*13);x.lineTo(cx-dx*12-dy*13,cy-dy*12+dx*13);x.fill()}
 const st=g.liz.map(L=>'蜥蜴：'+L.mode+(L.mode==='吃'?'（还要 '+L.busy+' 回合）':'')).join('　');
 document.getElementById('hud').textContent=`回合 ${g.turn} / ${g.rain}（到 ${g.rain} 下雨）　吃了 ${g.ate} / ${g.need}　${st}\n`+(g.log.join('；')||'')+(g.won?'\n过了！':g.dead?'\n按 R 重来':'');
}
addEventListener('keydown',e=>{const m={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,' ':-1}[e.key];
 if(e.key==='r'||e.key==='R'){start(li);return} if(m===undefined)return;e.preventDefault();move(g,m);draw()});
document.getElementById('rule').innerHTML="<pre style=\"white-space:pre-wrap\"># 读它（回合制，文字画面）\n\n你是一只小东西（@）。要吃够 3 只虫（b），在雨来之前（30 回合）回到窝（H）。\n地图上有一只蜥蜴，画成箭头（^ &gt; v &lt;），箭头是它脸朝的方向。它会吃你，也吃虫。\n\n## 怎么玩\n`node 玩.js 关/2.txt &quot;rrdd.&quot;`：u 上、r 右、d 下、l 左、. 原地不动。程序每次都从头按你给的这一串走，每一步后画一张图。想接着走，就在原来那串后面加字再跑一遍。加 `-a` 只画最后一张。\n\n## 画面\n- `#` 墙，走不了。`&quot;` 草：谁都能走进去；蜥蜴看不穿草，你站在草里它也看不见你。\n- `:` 蜥蜴这会儿眼睛朝着的格（朝前最多 5 格，越远越宽）。这是它这回合走完、转完身以后的样子，下回合它就用这双眼看。所以你站在冒号里、底下还写着&quot;巡&quot;，意思是它还没看，下回合一看就会看见你。\n- `*` 蜥蜴没看见谁的时候，接下来几步要走的格。\n- `o`：受了惊的虫下一步要逃去的格（这一回合你一走完，它就挪过去）。\n- `X` 和 `+`：它在追、在找的时候，`X` 是它要去的那格（找你时就是它最后看见你的那格），`+` 是它要走的路。追虫时 X 在虫身上，看到的是虫。\n- 最底下一行写着它此刻在干什么：巡、发现你/发现虫、追你/追虫、找你、吃。\n\n## 一回合里先后\n1. 你走一格（走到虫上就吃掉；吃够 3 只走进窝就赢）。\n2. 虫动：蜥蜴离一只虫 3 步以内（横竖步数加起来），这只虫往离蜥蜴远的方向挪一格。虫不怕你。\n3. 蜥蜴动：\n   - 它看看眼里有什么（你、虫），盯最近的那个；一样近先盯虫。\n   - 头一回看见，它先停这一回合，转过来盯着（发现）；下一回合起扑过去，一回合走 2 格（追）。\n   - 追着的东西不见了（躲进草、拐过墙角），它跑到最后看见的那格去找（找你），到了还没看见，就接着巡。\n   - 它走进你那格，你就死了。它走到虫那格就吃掉这只虫，要吃两回合，这两回合不动。\n   - 没东西可盯时它巡：一直往前走，挡住了先往它自己的右手边拐，再挡往左手边，再挡就掉头。一回合 1 格。它不进窝。\n</pre>";
start(0);
</script>
